<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EPFO ECR Viewer</title>
<style>
  :root { --blue: #0b5394; --border: #d0d7de; --miss: #fdecea; --hit: #eaf6ea; }
  * { box-sizing: border-box; }
  html, body { width: 100%; overflow-x: hidden; }
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f5f7fa; color: #1c2733; }
  header { background: var(--blue); color: white; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .wrap { width: 100%; margin: 0 auto; padding: 20px 24px; border-left: 3px solid var(--blue); border-right: 3px solid var(--blue); min-height: 100vh; }
  .search-box { position: relative; margin-bottom: 20px; }
  #q { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border); border-radius: 6px; }
  #suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border);
    border-top: none; border-radius: 0 0 6px 6px; max-height: 300px; overflow-y: auto; z-index: 10; display: none; }
  .sugg-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  .sugg-item:hover { background: #f0f6fb; }
  .sugg-est { font-weight: 600; color: var(--blue); }
  .sugg-name { color: #555; font-size: 14px; }
  #est-header { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 14px 18px; margin-bottom: 14px; display: none; }
  #est-header .name { font-size: 17px; font-weight: 600; }
  #est-header .meta { color: #667; font-size: 13px; margin-top: 2px; }
  #est-header .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px 18px; margin-top: 10px; font-size: 13px; }
  #est-header .detail-grid .label { color: #889; font-weight: 600; margin-right: 4px; }
  .year-block { background: white; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; width: 100%; }
  .year-title { padding: 10px 14px; background: #eef3f8; font-weight: 600; border-bottom: 1px solid var(--border); color: var(--blue); }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 11px; }
  th, td { border: 1px solid var(--border); padding: 3px 2px; text-align: center; white-space: normal; word-break: break-word; overflow: hidden; }
  th.row-label, td.row-label { width: 90px; }
  thead th { background: #f8fafc; font-weight: 600; }
  .missed { background: var(--miss); color: #a33; }
  .filed { background: var(--hit); }
  .row-label { text-align: left; font-weight: 600; background: #fafbfc; }
  #empty { color: #778; padding: 40px; text-align: center; display: none; }
</style>
</head>
<body>
<header><h1>EPFO Establishment ECR Viewer</h1></header>
<div class="wrap">
  <div class="search-box">
    <input id="q" type="text" placeholder="Search by Establishment ID or Name..." autocomplete="off">
    <div id="suggestions"></div>
  </div>

  <div id="est-header">
    <div class="name" id="est-name"></div>
    <div class="meta" id="est-meta"></div>
    <div class="detail-grid" id="est-details"></div>
  </div>

  <div id="results"></div>
  <div id="empty">Search for an establishment above to view its ECR remittance history.</div>
</div>

<script>
const q = document.getElementById('q');
const suggestions = document.getElementById('suggestions');
const results = document.getElementById('results');
const empty = document.getElementById('empty');
const estHeader = document.getElementById('est-header');
const estName = document.getElementById('est-name');
const estMeta = document.getElementById('est-meta');

empty.style.display = 'block';
let debounceTimer;

q.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const val = q.value.trim();
  if (val.length < 2) { suggestions.style.display = 'none'; return; }
  debounceTimer = setTimeout(() => doSearch(val), 250);
});

async function doSearch(val) {
  const res = await fetch('/api/search?q=' + encodeURIComponent(val));
  const data = await res.json();
  if (!data.length) { suggestions.style.display = 'none'; return; }
  suggestions.innerHTML = data.map(r =>
    `<div class="sugg-item" data-est="${r.est_id}">
       <div class="sugg-est">${r.est_id}</div>
       <div class="sugg-name">${r.est_name || ''}</div>
     </div>`
  ).join('');
  suggestions.style.display = 'block';
  suggestions.querySelectorAll('.sugg-item').forEach(el => {
    el.addEventListener('click', () => {
      q.value = el.dataset.est;
      suggestions.style.display = 'none';
      loadEstablishment(el.dataset.est);
    });
  });
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) suggestions.style.display = 'none';
});

q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    resolveAndLoad(q.value.trim());
  }
});

async function resolveAndLoad(text) {
  if (!text) return;
  suggestions.style.display = 'none';

  // If it's already showing suggestions, use the first one - fastest path.
  const firstSugg = suggestions.querySelector('.sugg-item');
  if (firstSugg) {
    const estId = firstSugg.dataset.est;
    q.value = estId;
    loadEstablishment(estId);
    return;
  }

  // Otherwise (e.g. user typed fast and pressed Enter before suggestions
  // rendered, or typed a name rather than the exact ID), search first and
  // pick the best match.
  const res = await fetch('/api/search?q=' + encodeURIComponent(text));
  const data = await res.json();
  if (!data.length) {
    results.innerHTML = '<div id="empty" style="display:block">No establishment found matching "' + text + '"</div>';
    estHeader.style.display = 'none';
    return;
  }
  // Prefer an exact EST_ID match if the user typed the full code.
  const exact = data.find(r => r.est_id.toUpperCase() === text.toUpperCase());
  const chosen = exact || data[0];
  q.value = chosen.est_id;
  loadEstablishment(chosen.est_id);
}

function fmtAmt(v) {
  if (v === null || v === undefined) return '-';
  return Number(v).toLocaleString('en-IN');
}

async function loadEstablishment(estId) {
  if (!estId) return;
  const res = await fetch('/api/establishment/' + encodeURIComponent(estId));
  if (!res.ok) {
    results.innerHTML = '<div id="empty" style="display:block">No establishment found for "' + estId + '"</div>';
    estHeader.style.display = 'none';
    return;
  }
  const data = await res.json();
  empty.style.display = 'none';

  estHeader.style.display = 'block';
  estName.textContent = data.est_id + ' — ' + (data.est_name || '');
  estMeta.textContent = 'Office ID: ' + (data.office_id || '-');
  estHeader.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const details = [
    ['Address', data.address1],
    ['City', data.city],
    ['District', data.district],
    ['Pin', data.pin],
    ['Email ID', data.email],
    ['Task ID', data.task_id],
    ['DSC', data.dsc],
    ['ESN', data.esn],
    ['Form 5A', data.form_5a],
  ];
  document.getElementById('est-details').innerHTML = details.map(([label, val]) =>
    `<div><span class="label">${label}:</span>${val || '-'}</div>`
  ).join('');

  if (!data.years.length) {
    results.innerHTML = '<div id="empty" style="display:block">No ECR records found for this establishment.</div>';
    return;
  }

  results.innerHTML = data.years.map(y => `
    <div class="year-block">
      <div class="year-title">Financial Year ${y.label} (Apr - Mar)</div>
      <table>
        <thead>
          <tr>
            <th class="row-label">Month</th>
            ${y.months.map(m => `<th>${m.month}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="row-label">ECR</td>
            ${y.months.map(m => `<td class="${m.filed ? 'filed' : 'missed'}">${m.filed ? m.ecr_count : '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="row-label">Employee</td>
            ${y.months.map(m => `<td class="${m.filed ? 'filed' : 'missed'}">${m.filed ? m.employees : '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="row-label">Contribution</td>
            ${y.months.map(m => `<td class="${m.filed ? 'filed' : 'missed'}">${m.filed ? fmtAmt(m.contribution) : '-'}</td>`).join('')}
          </tr>
        </tbody>
      </table>
    </div>
  `).join('');
}
</script>
</body>
</html>
